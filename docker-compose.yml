volumes:
  datafiles:
  redis-data:
  elasticsearch-data:

services:
  elasticsearch:
    container_name: els
    image: docker.elastic.co/elasticsearch/elasticsearch:8.7.1
    ports:
        - "9200:9200"
    volumes:
        - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
        - discovery.type=single-node
        - xpack.security.enabled=false
    networks:
        - ecommnetwork

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.7.1
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    networks:
      - ecommnetwork

  tga.mysql:
    image: mysql:latest
    container_name: tga.mysql
    environment:
        MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    #Specify where the persisted Data should be stored
    volumes:
      - datafiles:/var/lib/mysql
      - ./my.cnf:/etc/mysql/my.cnf
    healthcheck:
       test : ["CMD", "mysqladmin", "ping", "-h", "localhost"]
       interval: 10s
       timeout: 5s
       retries: 5
    networks:
      - ecommnetwork
  
  rabbitmq: # login guest:guest
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: "rabbitmq"
    labels:
      NAME: "rabbitmq"
    ports:
     - "5672:5672"
     - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommnetwork
  
  tga.redis:
    image: redis:latest
    container_name: tga.redis
    ports:
       - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    command: ["redis-server"]
    volumes:
       - redis-data:/data  
    networks:
       - ecommnetwork

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: always
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
        test: wget -q --tries=1 -O- http://localhost:9090/
        interval: 3s
        timeout: 3s
        retries: 10
        start_period: 10s
        
  capstone.ecommerceapp.authapi:
    image: ${DOCKER_REGISTRY-}authapi
    container_name: authapi
    build:
      context: .
      dockerfile: Capstone.ECommerceApp.Auth.API/Dockerfile
    depends_on:
      tga.mysql:
        condition: service_healthy
    ports:
      - "5000:8080"
      - "7002:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CERT_THUMBPRINT=b404c48e0254dca183079a0c5ec8e58bf8b11015
      - CERT_SUBJECT=CN=localhost
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
      - OTEL_SERVICE_NAME=Auth-Services
      - ConnectionStrings__AuthDbConnection=Server=tga.mysql;port=3306;Database=TGA_Auth;User=root;Password=password;
      - ApiSettings__JwtOptions__Secret=This is used to Sign and verify JWT tokens, Replace it with your own secret
      - ApiSettings__JwtOptions__Issuer=TGA-Auth-API
      - ApiSettings__JwtOptions__Aud]ience=TGA-Client
      - ApiSettings__JwtOptions__ExpiryInHours=7
      - ApiSettings__RabbitMQ__HostName=rabbitmq
      - ApiSettings__RabbitMQ__UserName=guest
      - ApiSettings__RabbitMQ__Password=guest
      - ApiSettings__RabbitMQ__TopicAndQueueNames__UserRegistrationQueue=userregistration
    networks:
      - ecommnetwork

  capstone.ecommerceapp.productapi:
    image: ${DOCKER_REGISTRY-}productapi
    container_name: productapi
    build:
      context: .
      dockerfile: Capstone.ECommerceApp.Product.API/Dockerfile
    #This Service Depends on the database service specifed above
    depends_on:
      tga.mysql:
        condition: service_healthy
    ports:
      - "7000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ProductDbConnection=Server=tga.mysql;port=3306;Database=TGA_Product;User=root;Password=password;
      - ApiSettings__JwtOptions__Secret=This is used to Sign and verify JWT tokens, Replace it with your own secret
      - ApiSettings__JwtOptions__Issuer=TGA-Auth-API
      - ApiSettings__JwtOptions__Audience=TGA-Client
      - ApiSettings__JwtOptions__ExpiryInHours=7
      - CORS_ALLOWED_ORIGINS=http://localhost:7004;http://localhost:7003
    networks:
      - ecommnetwork
  
  capstone.ecommerceapp.orderapi:
    image: ${DOCKER_REGISTRY-}orderapi
    container_name: orderapi
    build:
      context: .
      dockerfile: Capstone.ECommerceApp.Order.API/Dockerfile
    #This Service Depends on the database service specifed above
    depends_on:
      tga.mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy        
    ports:
      - "7004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__OrderDbConnection=Server=tga.mysql;port=3306;Database=TGA_Order;User=root;Password=password;
      - ApiSettings__Secret=This is used to Sign and verify JWT tokens, Replace it with your own secret
      - ApiSettings__Issuer=TGA-Auth-API
      - ApiSettings__Audience=TGA-Client
      - ServiceUrls__ProductAPI=http://capstone.ecommerceapp.productapi:8080/
      - ServiceUrls__InventoryAPI=http://capstone.ecommerceapp.productapi:8080/
      - ServiceUrls__PaymentAPI=http://capstone.ecommerceapp.paymentapi:8080/
      - Stripe__SecretKey=sk_test_51QiGz5CQ7mJfnXMskjXynI3SYDC8L68EXwvj6mkKy3tXKBYCpxFfEJvjOTfJKxCx7XuhKKEpYyqP0Qj4hc7MFFSV00SRq4yB7H
      - ApiSettings__RabbitMQ__HostName=rabbitmq
      - ApiSettings__RabbitMQ__UserName=guest
      - ApiSettings__RabbitMQ__Password=guest
      - ApiSettings__RabbitMQ__TopicAndQueueNames__OrderQueue=order
      - Serilog__MinimumLevel__Default=Information
      - Serilog__MinimumLevel__Override__Microsoft=Warning
      - Serilog__MinimumLevel__Override__System=Warning
      - ElasticConfiguration__Uri=http://elasticsearch:9200/
    networks:
      - ecommnetwork
  
  capstone.ecommerceapp.shoppingcartapi:
    depends_on:
      tga.redis:
        condition: service_healthy
    image: ${DOCKER_REGISTRY-}shoppingcartapi
    container_name: shoppingcartapi
    build:
      context: .
      dockerfile: Capstone.ECommerceApp.ShoppingCart.API/Dockerfile
    ports:
      - "7003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CartDbConnection=Server=tga.mysql;port=3306;Database=TGA_ShoppingCart;User=root;Password=password;
      - ApiSettings__Secret=This is used to Sign and verify JWT tokens, Replace it with your own secret
      - ApiSettings__Issuer=TGA-Auth-API
      - ApiSettings__Audience=TGA-Client
      - ServiceUrls__ProductAPI=http://capstone.ecommerceapp.productapi:8080/
      - Redis__ConnectionString=tga.redis:6379,abortConnect=false
    networks:
      - ecommnetwork
  
  capstone.ecommerceapp.notificationapi:
    image: ${DOCKER_REGISTRY-}notificationapi
    container_name: notificationapi
    build:
      context: .
      dockerfile: Capstone.ECommerceApp.Notification.API/Dockerfile
    #This Service Depends on the database service specifed above
    depends_on: 
      tga.mysql: 
          condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "7005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__NotificationDbConnection=Server=tga.mysql;port=3306;Database=TGA_Notification;User=root;Password=password;
      - ApiSettings__RabbitMQ__HostName=rabbitmq
      - ApiSettings__RabbitMQ__UserName=guest
      - ApiSettings__RabbitMQ__Password=guest
      - ApiSettings__RabbitMQ__TopicAndQueueNames__OrderQueue=userregistration
    networks:
      - ecommnetwork 
  
  capstone.ecommerceapp.paymentapi:
    image: ${DOCKER_REGISTRY-}paymentapi
    container_name: paymentapi
    build:
      context: .
      dockerfile: Capstone.ECommerceApp.Payment.API/Dockerfile
    ports:
      - "7006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__Secret=This is used to Sign and verify JWT tokens, Replace it with your own secret
      - ApiSettings__Issuer=TGA-Auth-API
      - ApiSettings__Audience=TGA-Client
    networks:
      - ecommnetwork

  capstone.ecommerceapp.ocelotapigateway:
    image: ${DOCKER_REGISTRY-}ocelotapigateway
    container_name: ocelotapigateway
    build:
      context: .
      dockerfile: Capstone.ECommerceApp.OcelotApiGateway/Dockerfile
    ports:
      - "7777:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__Secret=This is used to Sign and verify JWT tokens, Replace it with your own secret
      - ApiSettings__Issuer=TGA-Auth-API
      - ApiSettings__Audience=TGA-Client
    links:
      - capstone.ecommerceapp.productapi      
    depends_on:
      - capstone.ecommerceapp.productapi
    networks:
      - ecommnetwork

networks:
  ecommnetwork:
   driver: bridge     